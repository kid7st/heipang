name: HEIPANG Meta Release

# Builds the HEIPANG Meta installers (Windows NSIS + macOS arm64 dmg). A push of
# a `meta-v*` tag also publishes them as a GitHub Release; the in-app updater
# reads the latest published release, with release-notes/<version>.md as its
# notes. workflow_dispatch only builds artifacts.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "meta-v*"

jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/meta-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag, version and release notes
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "meta-v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
          test -s "release-notes/${version}.md" || { echo "Missing release-notes/${version}.md"; exit 1; }

  windows:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        env:
          ANTIGRAVITY_SOURCE_TOKEN: ${{ secrets.ANTIGRAVITY_SOURCE_TOKEN }}
        run: bash scripts/install-release-dependencies.sh
      - name: Build + package HEIPANG Meta (NSIS x64)
        run: npm run pack:meta:win -- --publish never
      - name: List artifacts
        shell: bash
        run: ls -la release-meta || dir release-meta
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEIPANG-Meta-Setup-exe
          path: release-meta/*.exe
          if-no-files-found: error

  mac:
    needs: validate
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        env:
          ANTIGRAVITY_SOURCE_TOKEN: ${{ secrets.ANTIGRAVITY_SOURCE_TOKEN }}
        run: bash scripts/install-release-dependencies.sh
      - name: Build + package HEIPANG Meta (dmg arm64)
        run: npm run pack:meta:mac -- --publish never
      - name: List artifacts
        run: ls -la release-meta || true
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEIPANG-Meta-arm64-dmg
          path: release-meta/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/meta-v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#meta-v}"
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/*.exe \
            --title "HEIPANG Meta ${version}" --notes-file "release-notes/${version}.md" --verify-tag
